[project]
name = "villa360"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==21.6",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "aiohttp==3.14.3",
    "fastapi==0.115.6",
    "tzdata==2025.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.main:app"
